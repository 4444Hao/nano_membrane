max_evaluation_jobs: 1
max_proposal_jobs: 1
max_db_workers: 2

db_config:
  num_islands: 1
  archive_size: 35
  elite_selection_ratio: 0.5
  num_archive_inspirations: 3
  num_top_k_inspirations: 2

evo_config:
  patch_types: [full, diff]
  patch_type_probs: [0.9, 0.1]

  num_generations: 50
  max_api_costs: 3.5

  max_patch_resamples: 5
  max_patch_attempts: 5
  max_novelty_attempts: 2

  job_type: local
  language: python

  llm_models:
    - "gpt-5-mini"

  llm_kwargs:
    temperatures: [0.4]
    reasoning_efforts: [medium]
    max_tokens: [8192]

  llm_dynamic_selection: ucb1
  llm_dynamic_selection_kwargs:
    exploration_coef: 0.8
    cost_aware_coef: 0.8

  embedding_model: text-embedding-3-small

  init_program_path: initial.py
  results_dir: results/membrane_run

job_time: "00:15:00"